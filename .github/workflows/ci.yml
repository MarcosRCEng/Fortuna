name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fortuna
          POSTGRES_PASSWORD: fortuna
          POSTGRES_DB: fortuna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fortuna -d fortuna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fortuna:fortuna@localhost:5432/fortuna
      FORTUNA_PERSISTENCE: prisma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
